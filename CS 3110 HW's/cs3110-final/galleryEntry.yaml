# Write a short, attention-grabbing description of your project.
desc: >
  Boid Meets World is an ecosystem simulation that demonstrates disparate 
  individual predators targeting a flock of creatures. The prey creatures 
  are simulated with an algorithm inspired by Boids, a program developed 
  by Craig Reynolds in 1986, while the predator creatures follow a set of 
  rules we developed. The prey reproduce when they encounter sufficient 
  food and flee from predators, while the predators are attracted to and 
  consume the boids.